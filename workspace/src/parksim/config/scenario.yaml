# ============================================================================
# 当前生效场景配置（simulator 读取）
#
# 优先级：simulator.yaml（基础配置） < 本文件（场景预设） < launch 参数
#   launch 覆盖示例：ros2 launch parksim parksim.launch.py allocation_method:=graph_cost
#   切换预设：      ros2 launch parksim parksim.launch.py scenario:=example_random
#
# 模式：
#   random  - 随机生成（数量/间隔/占用随机化；泊位分配由 allocation_method 决定）
#   replay  - 经验初始化：按所选场地数据（数据场景）真实占用 + 回放其智能体
#   custom  - 按显式时间表生成（custom.file 指向预设文件，或直接在该文件内定义 vehicles）
#
# 本文件默认值与原行为一致（30/30、间隔 5s、seed 0），可作为场景预设的模板。
# ============================================================================

mode: random

random:
  seed: 0                    # 随机种子（与原 random_seed 默认一致）
  entering: 30               # 入库车辆数
  exiting: 30                # 出库车辆数
  interval_mean: 5.0         # 到达间隔均值（指数分布，秒）
  y_bound: 72                # 入口清空门控：y 低于该值后才允许下一辆入库。
                             # 仅在「无门户」的旧场地地图生效；带 portals 的地图
                             # （如 jth_b1）入场点由 portal 几何决定，该判据自动停用，
                             # 改由「驶离入场点 > 30 m」判据决定。
  gate_timeout: 45.0         # 入口放行门强制放行超时（秒，仿真时钟；暂停时冻结）。
                             # 上一辆入场车超过该时长仍未驶离入口区域则强制放行，
                             # 避免车辆异常/位置偏远让入场队列永久停摆。下限 1.0 s。
  # ---- 持续生成（无终点的事件生成）----
  # continuous: true 时忽略 entering/exiting，按上面的到达分布**无限**生成事件：
  #   队列只保留 1 个「待用间隔」，每次放行（或抽签丢弃）后立刻补抽下一个。
  #   指数分布无记忆，「用掉一个再抽一个」与「先抽 N 个」的到达过程完全同分布。
  #   终止只由人工暂停/停止或 max_duration 决定。
  #   注意：持续模式下 webviz 永不进入「已完成」——余量恒为 1，这是预期语义。
  continuous: false          # 默认关：保持有限生成（entering/exiting 有意义的旧行为）
  # 占用率门控：把泊位占用率钳在 [exiting_occupancy_min, entering_occupancy_max] 内。
  #   不限量后，入场会把场停满、出场会把场抽空，任一侧饱和都会让该侧事件流实质停摆；
  #   用占用率做闭环，两侧事件流才能长期持续。关闭时不做任何限制（可能饱和）。
  occupancy_gate: false
  entering_occupancy_max: 0.90   # 占用率 < 该值才放行入库（比例 0-1，钳到 [0,1]）
  exiting_occupancy_min: 0.10    # 占用率 > 该值才放行出库（比例 0-1，钳到 [0,1]）
  # ---- 可选安全阀（0 = 不限，默认关）----
  max_duration: 0.0          # 仿真时钟达该秒数后清空两条发车队列（已在场车辆跑完）。
                             # 清空是为了让余量归零 → webviz 可正常进入「已完成」。
  max_concurrent: 0          # 同时在场车辆上限（按仍在运行的车辆进程数计）。
  occupancy_random:          # 随机生成：车位占用随机化（经验初始化不受影响）
    enable: true             # true = 重掷占用；false = 使用数据集真实占用
    count: 0                 # 占用数量；0 = 同数据集占用数量（此时 ratio 忽略）
    ratio: 0.0               # 占用比例（0-1）；count<=0 且 ratio>0 时按比例
  occupancy:
    blocked: []              # 追加封锁的车位（在 simulator.yaml blocked_spots 之外）
    occupied: []             # 预占用车位（虚拟已停车）
  entering_spot_pool: []     # 空 = 不限；非空 = 入库车辆仅从该车位池选择

replay:
  agents_data_path: ""       # 空 = 使用 simulator.yaml / global_params 的 agents_data_path
  time_scale: 1.0            # 时间轴缩放（>1 更快）
  max_agents: 0              # 0 = 全部；N>0 = 按 init_time 取前 N 个

custom:
  file: "scenarios/example_custom.yaml"   # 自定义时间表文件（相对 config 目录；留空则为空场）
