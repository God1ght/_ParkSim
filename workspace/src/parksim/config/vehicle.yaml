/**:
  ros__parameters:
    timer_period: 0.1
    simulation_speedup: 1.0

    warm_start_time: 0.3

    entrance_coords: [14.38, 76.21]

    # Offline data to load
    spots_data_path: "${PARKSIM_ROOT}/python/parksim/priorFiles/spots_data.pickle"
    waypoints_graph_path: "${PARKSIM_ROOT}/python/parksim/priorFiles/waypoints_graph.pickle"
    intent_model_path: "${PARKSIM_ROOT}/python/parksim/priorFiles/model/smallRegularizedCNN_L0.068_01-29-2022_19-50-35.pth"

    offline_maneuver_path: "${PARKSIM_ROOT}/python/parksim/priorFiles/parking_maneuvers.pickle"

    # RL evaluation bridge. Training remains headless; ROS only loads learned policies for evaluation.
    agent_type: "rule_based"
    rl_policy_path: ""
    rl_max_steps: 1000

    # Qwen-VLA high-level policy. Empty endpoint uses deterministic fallback for smoke tests.
    qwen_endpoint: ""
    qwen_model: "Qwen2.5-VL-7B-Instruct"
    qwen_timeout: 15.0
    qwen_decision_period: 3.0
    qwen_max_candidate_spots: 8
    qwen_periodic_replan: false
    qwen_decision_log_path: "${PARKSIM_ROOT}/vehicle_log/qwen_vla_decisions.jsonl"

    # Evaluation logs used by policy comparison scripts.
    trace_log_enabled: true
    trace_log_path: ""
    summary_log_path: ""
