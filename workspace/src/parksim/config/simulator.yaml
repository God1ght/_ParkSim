/simulator:
  ros__parameters:
    timer_period: 0.05
    simulation_speedup: 1.0

    # Map related
    spots_data_path: "${PARKSIM_ROOT}/python/parksim/priorFiles/spots_data.pickle"

    blocked_spots: [42, 43, 44, 45, 64, 65, 66, 67, 68, 69, 92, 93, 94, 110, 111, 112, 113, 114, 115, 134, 135, 136, 156, 157, 158, 159, 160, 161, 184, 185, 186, 202, 203, 204, 205, 206, 207, 226, 227, 228, 248, 249, 250, 251, 252, 253, 276, 277, 278, 294, 295, 256, 297, 298, 299, 318, 319, 320, 340, 341, 342, 343, 344, 345] # Spots to be blocked in advance: 3 left and 3 right spaces of each row, except right spaces of right row, since doesn't unpark into an aisle

    # ======== Spawn
    spawn_entering: 30
    spawn_exiting: 30
    spawn_interval_mean: 5 # (s)
    background_mode: "replay" # replay, rule_random, mixed, or human_mixed

    # Human-machine mixed long-horizon scenario generator. Defaults preserve legacy behavior.
    traffic_flow_mode: "legacy"
    long_horizon_duration: 600.0
    restore_obstacles_as_exit_vehicles: false
    static_obstacle_exit_fraction: 0.35
    static_obstacle_exit_max: 40
    static_obstacle_exit_start_time: 5.0
    long_horizon_enter_interval_mean: 10.0
    long_horizon_exit_interval_mean: 14.0
    # Actor-class-specific exponential inter-event means. Values <= 0 fall
    # back to the two legacy aggregate means above.
    long_horizon_human_enter_interval_mean: -1.0
    long_horizon_human_exit_interval_mean: -1.0
    long_horizon_av_enter_interval_mean: -1.0
    long_horizon_av_exit_interval_mean: -1.0
    human_intent_hidden_fraction: 0.75
    max_concurrent_background_vehicles: 80
    delayed_spawn_retry_seconds: 2.0
    exit_spot_reuse_delay: 20.0
    entry_vehicle_agent_type: "rule_based"
    exit_vehicle_agent_type: "rule_based"

    # Optional Qwen-VLA ego vehicle for closed-loop demos.
    spawn_qwen_ego: false
    qwen_ego_spawn_time: 0.5
    qwen_ego_spot_index: 1

    # Generic controlled ego for rule_based vs qwen_vla comparisons.
    spawn_controlled_ego: false
    controlled_ego_spawn_time: 0.5
    controlled_ego_spot_index: 1
    controlled_ego_agent_type: "qwen_vla"

    qwen_endpoint: ""
    qwen_model: "Qwen2.5-VL-7B-Instruct"
    qwen_timeout: 15.0
    qwen_decision_period: 3.0
    qwen_max_candidate_spots: 8
    qwen_periodic_replan: false
    qwen_decision_log_path: ""

    y_bound_to_resume_spawning: 72
