/simulator:
  ros__parameters:
    timer_period: 0.05

    # Map related
    spots_data_path: "${PARKSIM_ROOT}/python/parksim/priorFiles/spots_data.pickle"

    blocked_spots: [42, 43, 44, 45, 64, 65, 66, 67, 68, 69, 92, 93, 94, 110, 111, 112, 113, 114, 115, 134, 135, 136, 156, 157, 158, 159, 160, 161, 184, 185, 186, 202, 203, 204, 205, 206, 207, 226, 227, 228, 248, 249, 250, 251, 252, 253, 276, 277, 278, 294, 295, 256, 297, 298, 299, 318, 319, 320, 340, 341, 342, 343, 344, 345] # Spots to be blocked in advance: 3 left and 3 right spaces of each row, except right spaces of right row, since doesn't unpark into an aisle

    # ======== Spawn
    spawn_entering: 30
    spawn_exiting: 30
    spawn_interval_mean: 5 # (s)
    background_mode: "replay" # replay, rule_random, or mixed

    # Optional Qwen-VLA ego vehicle for closed-loop demos.
    spawn_qwen_ego: false
    qwen_ego_spawn_time: 0.5
    qwen_ego_spot_index: 1

    # Generic controlled ego for rule_based vs qwen_vla comparisons.
    spawn_controlled_ego: false
    controlled_ego_spawn_time: 0.5
    controlled_ego_spot_index: 1
    controlled_ego_agent_type: "qwen_vla"

    qwen_endpoint: ""
    qwen_model: "Qwen2.5-VL-7B-Instruct"
    qwen_timeout: 15.0
    qwen_decision_period: 3.0
    qwen_max_candidate_spots: 8
    qwen_periodic_replan: false
    qwen_decision_log_path: ""

    y_bound_to_resume_spawning: 72


    